# OB Max: Seerr (requests) on the Raspberry Pi, next to Jellyfin.
# Reached only from the LAN: by the Moonbase plugin inside Jellyfin
# (http://<Pi LAN address>:5055) and by the administrator's browser.
# Never exposed through Caddy.
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Paris
      - PORT=5055
    ports:
      - "5055:5055"
    volumes:
      - ./config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
