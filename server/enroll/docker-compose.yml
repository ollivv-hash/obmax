# obmax-enroll on the Raspberry Pi, next to Jellyfin.
# Host networking keeps the caller's real address (Caddy on the NAS), which
# the service checks: only 192.168.0.101 gets through.
services:
  obmax-enroll:
    build: .
    image: obmax-enroll:local
    container_name: obmax-enroll
    restart: unless-stopped
    network_mode: host
    user: "65532:65532"
    volumes:
      - ./data:/data
    environment:
      JELLYFIN_URL: http://192.168.0.206:8096   # Jellyfin does not listen on 127.0.0.1
      # Private, from .env next to this file (ignored by git):
      #   PUBLIC_SERVER_URL=https://jellyfin.example.com
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:?set PUBLIC_SERVER_URL in .env}
      # Caddy: on this Pi (127.0.0.1); the NAS entry is the old location.
      ENROLL_TRUSTED_PROXIES: 127.0.0.1/32,192.168.0.101/32
      ENROLL_PUBLIC_ADDR: ":8787"
      ENROLL_ADMIN_ADDR: ":8788"
      ENROLL_CERT_VALIDITY: 4320h   # 180 days
      ENROLL_INVITE_VALIDITY: 48h
      ENROLL_APK_URL: https://github.com/ollivv-hash/obmax-releases/releases/latest
