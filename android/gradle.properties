org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false
# flutter_inappwebview_android 1.1.3 still asks for proguard-android.txt, which
# AGP 9 rejects. Only the plugin's consumer rules reach the app's R8 pass, so
# allowing it changes nothing in the shipped build. Drop this once
# flutter_inappwebview 6.2 is stable.
android.r8.proguardAndroidTxt.disallowed=false
# OBMAX: Flutter would set defaultConfig abiFilters to arm, arm64 and x86_64,
# which the flavor filters (ARM only, android/app/build.gradle.kts) add to:
# plugins then package lib/x86_64 without libflutter.so.
disable-abi-filtering=true
